name: Site CI/CD

on:
  push:
    branches: [main, 'claude/**']
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      SITE_URL: https://wglewis0721.github.io/WD-AutoDetailing
      # The Vercel checkout function (api/create-checkout.ts). Empty = preview mode, no payment taken.
      # Set under Settings > Secrets and variables > Actions > Variables > CHECKOUT_URL.
      PUBLIC_CHECKOUT_URL: ${{ vars.CHECKOUT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx astro check
      - run: npm test
      - run: npm run build
      - name: Book buttons and contact links
        run: |
          test "$(grep -o 'href="/book' dist/index.html | wc -l)" -ge 5
          grep -q 'mirror-finish-mobile-detailing.square.site' dist/index.html
          grep -q 'tel:+13346522601' dist/index.html
          ! grep -qi 'localhost' dist/index.html
      - name: Make a copy that works from any URL path
        run: node scripts/make-relative.mjs dist-relative
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist-relative

  # GitHub Pages hosts the static site; this job's run summary shows the URL.
  # One-time repo setup: Settings > Pages > Source = "GitHub Actions".
  # Branch previews also need the branch allowed under Settings > Environments > github-pages.
  deploy:
    needs: quality
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.ref != 'refs/heads/main' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Show URL
        run: echo "Site URL ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
