name: Sync Google Drive Assets

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  sync-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade google-auth-oauthlib google-auth-httplib2 google-api-python-client

      - name: Create and run sync script
        run: |
          python << 'SCRIPT'
          import json
          import os
          import sys
          from google.oauth2.service_account import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload
          import io

          print("=" * 70)
          print("🔍 GOOGLE DRIVE ASSET SYNC - START")
          print("=" * 70)

          # Load credentials
          creds_json = os.environ.get('GCP_SA_KEY') or os.environ.get('GOOGLE_API_KEY')
          if not creds_json:
              print("❌ No credentials found (GCP_SA_KEY or GOOGLE_API_KEY)")
              sys.exit(1)

          try:
              creds_dict = json.loads(creds_json)
              email = creds_dict.get('client_email', 'UNKNOWN')
              print(f"✓ Service Account: {email}")
          except Exception as e:
              print(f"❌ Invalid credentials: {e}")
              sys.exit(1)

          # Authenticate to Google Drive
          try:
              credentials = Credentials.from_service_account_info(
                  creds_dict,
                  scopes=['https://www.googleapis.com/auth/drive']
              )
              drive = build('drive', 'v3', credentials=credentials)
              print("✓ Authenticated with Google Drive API")
          except Exception as e:
              print(f"❌ Authentication failed: {e}")
              sys.exit(1)

          # Get root folder ID
          root_folder_id = os.environ.get('DRIVE_FOLDER_ID') or os.environ.get('GOOGLE_DRIVE_FOLDER_ID')
          if not root_folder_id:
              print("❌ No folder ID found (DRIVE_FOLDER_ID or GOOGLE_DRIVE_FOLDER_ID)")
              sys.exit(1)

          print(f"✓ Root Folder ID: {root_folder_id}")

          # Helper function to find folder by name
          def find_folder(parent_id, folder_name):
              try:
                  results = drive.files().list(
                      q=f"'{parent_id}' in parents and name='{folder_name}' and trashed=false and mimeType='application/vnd.google-apps.folder'",
                      spaces='drive',
                      fields='files(id, name)',
                      supportsAllDrives=True,
                      includeItemsFromAllDrives=True,
                      pageSize=1
                  ).execute()
                  files = results.get('files', [])
                  if files:
                      return files[0]['id']
              except Exception as e:
                  print(f"  ⚠️  Error finding folder '{folder_name}': {e}")
              return None

          # Helper function to download files from folder
          def sync_folder(folder_id, output_dir, folder_name):
              try:
                  os.makedirs(output_dir, exist_ok=True)

                  results = drive.files().list(
                      q=f"'{folder_id}' in parents and trashed=false and mimeType!='application/vnd.google-apps.folder'",
                      spaces='drive',
                      fields='files(id, name, size)',
                      supportsAllDrives=True,
                      includeItemsFromAllDrives=True,
                      pageSize=100
                  ).execute()

                  files = results.get('files', [])
                  print(f"  📊 Found {len(files)} file(s) in {folder_name}")

                  downloaded = 0
                  allowed = ('.jpg', '.jpeg', '.png', '.webp', '.gif', '.svg', '.ico', '.avif', '.heic', '.mp4', '.mov', '.webm', '.pdf')
                  for file in files:
                      if not file['name'].lower().endswith(allowed):
                          print(f"    - skipped {file['name']} (not an image/video/pdf)")
                          continue
                      try:
                          file_path = os.path.join(output_dir, file['name'])
                          request = drive.files().get_media(fileId=file['id'])
                          fh = io.BytesIO()
                          downloader = MediaIoBaseDownload(fh, request)

                          done = False
                          while not done:
                              status, done = downloader.next_chunk()

                          with open(file_path, 'wb') as f:
                              f.write(fh.getvalue())

                          print(f"    ✓ {file['name']} ({file.get('size', '?')} bytes)")
                          downloaded += 1
                      except Exception as e:
                          print(f"    ❌ Failed to download {file['name']}: {e}")

                  return downloaded
              except Exception as e:
                  print(f"  ❌ Error syncing folder: {e}")
                  return 0

          # Main sync process
          print("\n📂 Finding Assets folder...")
          assets_id = find_folder(root_folder_id, 'Assets')

          if not assets_id:
              print("❌ Assets folder not found!")
              print("   Make sure:")
              print("   - The 'Assets' folder exists in Gray Matter LLC")
              print("   - The service account has access")
              sys.exit(1)

          print(f"✓ Assets folder ID: {assets_id}")

          # Sync each asset type
          print("\n🔄 Syncing asset types:")
          asset_types = ['Images', 'Icons', 'Photos', 'Videos', 'Logos', 'UI-Components']
          total_files = 0

          for asset_type in asset_types:
              print(f"\n📦 {asset_type}:")
              type_id = find_folder(assets_id, asset_type)

              if not type_id:
                  print(f"  ⚠️  Folder not found")
                  continue

              output = f'Assets/{asset_type}'
              count = sync_folder(type_id, output, asset_type)
              total_files += count

          print("\n" + "=" * 70)
          print(f"✅ SYNC COMPLETE - {total_files} files downloaded")
          print("=" * 70)

          SCRIPT
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}

      - name: Check for changes
        run: |
          echo "📊 Git status:"
          git status
          echo ""
          echo "📁 Assets folder contents:"
          find Assets -type f 2>/dev/null | head -20 || echo "  (no files found)"

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Asset Sync Bot"

      - name: Commit and push
        run: |
          # Check for both modified files and new untracked files
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "ℹ️  No changes to commit"
          else
            echo "📝 Staging Assets folder..."
            git add Assets/
            echo "📝 Committing changes..."
            git commit -m "Sync assets from Google Drive [automated]" || echo "Nothing to commit"
            echo "🚀 Pushing to main..."
            git push origin main
            echo "✅ Push successful"
          fi
